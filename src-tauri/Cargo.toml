[package]
name = "saas-prototype-engine"
version = "1.0.0"
description = "SaaS Prototype Orchestration Engine Desktop Application"
authors = ["Creator"]
edition = "2021"

[lib]
name = "saas_prototype_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"], default-features = false }
keyring = { version = "3", features = ["windows-native"] }
